# Pulls runtime secrets from the self-hosted Infisical (magpie) `otfl`
# project and materializes them into the `otfl-github-oauth` Secret the
# Deployment already consumes. Kubernetes-native auth: no stored credential
# (see home-cloud docs/sops-to-infisical-migration.md, Phase 2 pattern).
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: otfl-secrets
  namespace: otfl
spec:
  # Internal Service DNS — no Traefik/Cloudflare round-trip for in-cluster reconciles.
  hostAPI: http://infisical.infisical.svc.cluster.local:8080
  resyncInterval: 60
  authentication:
    kubernetesAuth:
      # otfl-operator machine identity on the Infisical server.
      identityId: d072dd4e-dcb4-4b37-8847-145f23fe31c3
      autoCreateServiceAccountToken: true
      serviceAccountRef:
        name: otfl-infisical
        namespace: otfl
      secretsScope:
        projectSlug: otfl-qr-is
        envSlug: prod
        secretsPath: "/"
  managedSecretReference:
    secretName: otfl-github-oauth
    secretNamespace: otfl
    creationPolicy: Orphan   # absorb the cutover race (operator overwrites in-place)
